name: Build OpenHack-2.7

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            target: Android64
          - name: Android32
            target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (attempt 1)
        id: b1
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          combine: true
          target: ${{ matrix.config.target }}

      - name: Build (attempt 2)
        id: b2
        if: steps.b1.outcome == 'failure'
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          combine: true
          target: ${{ matrix.config.target }}

      - name: Build (attempt 3)
        if: steps.b1.outcome == 'failure' && steps.b2.outcome == 'failure'
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHack-2.7
          path: ${{ steps.combine.outputs.build-output }}
